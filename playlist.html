<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benji's Party Songs</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   YOUR TRACKS: edit this list. "file" is the audio file's name in the
   same GitHub folder as this page (MP3 works everywhere; M4A in most).
   ===================================================================== */
</style>
<script>
const TITLE = "Benji's party songs";
const TRACKS = [
  { title: "Shape of You",    file: "Shape_of_You.mp3" },
  { title: "Michelle",        file: "Michelle.mp3" },
  { title: "Toy",             file: "Toy.mp3" },
  { title: "Dami",            file: "Dami.mp3" },
  { title: "Jews from Judea", file: "Jews_from_Judea.mp3" },
  { title: "Self Aware",      file: "Self_Aware.mp3" },
];
</script>
<style>
:root{--bg:#5c6b3c;--card:#f2a7bd;--card-hi:#f9c8d6;--ink:#4a1a2c;--soft:#7a3a52;--row:#f7bfd0;--on:#4d5a32}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);font:16px/1.4 "Nunito Sans",system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:12px}
.player{width:100%;max-width:560px;background:linear-gradient(160deg,var(--card-hi),var(--card));border-radius:22px;padding:18px;box-shadow:inset 0 2px 0 #fff8,0 8px 20px -8px #0006}
h1{font:700 22px/1.1 "Pixelify Sans",sans-serif;margin:0 0 4px}
.now{font-size:14px;color:var(--soft);margin:0 0 12px;min-height:1.4em}
.controls{display:flex;align-items:center;gap:10px}
.controls button{width:48px;height:48px;border-radius:50%;border:0;background:var(--on);color:#fff;font:700 18px sans-serif;cursor:pointer;flex:none}
.controls button.play{width:56px;height:56px;font-size:20px}
.controls button:focus-visible,.list button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=range]{width:100%;accent-color:var(--on)}
.time{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.list button{width:100%;min-height:44px;text-align:left;border:0;border-radius:12px;background:var(--row);color:var(--ink);font:700 15px "Pixelify Sans",sans-serif;padding:0 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.list button.on{background:var(--on);color:#fff}
.list .n{opacity:.7;font:400 13px "Nunito Sans",sans-serif}
</style>
</head>
<body>
<div class="player">
  <h1 id="title"></h1>
  <p class="now" id="now">Pick a track</p>
  <div class="controls">
    <button id="prev" type="button" aria-label="Previous">&#9198;</button>
    <button id="play" class="play" type="button" aria-label="Play">&#9654;</button>
    <button id="next" type="button" aria-label="Next">&#9197;</button>
    <div class="bar">
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
      <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
  </div>
  <ol class="list" id="list"></ol>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
{
const $ = s => document.querySelector(s), audio = $('#audio');
let idx = -1;
$('#title').textContent = TITLE;
$('#list').innerHTML = TRACKS.map((t, i) => `<li><button type="button" data-i="${i}">${t.title}<span class="n">${i + 1}</span></button></li>`).join('');
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
function load(i, play = true) {
  idx = (i + TRACKS.length) % TRACKS.length;
  audio.src = TRACKS[idx].file;
  $('#now').textContent = 'Now playing: ' + TRACKS[idx].title;
  document.querySelectorAll('.list button').forEach(b => b.classList.toggle('on', +b.dataset.i === idx));
  if (play) audio.play().catch(() => {});
}
$('#list').addEventListener('click', e => { const b = e.target.closest('button'); if (b) load(+b.dataset.i); });
$('#play').addEventListener('click', () => { if (idx < 0) return load(0); audio.paused ? audio.play().catch(() => {}) : audio.pause(); });
$('#prev').addEventListener('click', () => load(idx < 0 ? 0 : idx - 1));
$('#next').addEventListener('click', () => load(idx + 1));
audio.addEventListener('play', () => { $('#play').innerHTML = '&#10074;&#10074;'; $('#play').setAttribute('aria-label', 'Pause'); });
audio.addEventListener('pause', () => { $('#play').innerHTML = '&#9654;'; $('#play').setAttribute('aria-label', 'Play'); });
audio.addEventListener('ended', () => load(idx + 1));          // plays through the list, then loops round
audio.addEventListener('timeupdate', () => {
  $('#cur').textContent = fmt(audio.currentTime); $('#dur').textContent = fmt(audio.duration);
  if (audio.duration) $('#seek').value = audio.currentTime / audio.duration * 1000;
});
$('#seek').addEventListener('input', e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; });
}
</script>
</body>
</html>
